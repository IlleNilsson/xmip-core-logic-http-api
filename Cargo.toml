[package]
name = "xmip-core-logic-http-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-logic-http-api"
description = "HTTP API logic technology: a method and path become a named operation with JSON arguments, and a result or fault becomes a status and body again; an OpenAPI document names the operations. A xmip-core-logic technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Logic trait and its shapes live there.
logic = { workspace = true }
stream = { workspace = true }
contract = { workspace = true }
# The description an API is bound to is read by the contract that holds it
# (ADR-0044); this technology takes the operations it declares from there.
openapi = { workspace = true }

# A fault body is JSON.
serde_json = "1"

[dev-dependencies]
xcore = { workspace = true }

[lints]
workspace = true
